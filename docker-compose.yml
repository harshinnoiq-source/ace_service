services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: cgm_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./cgm_service_full_backup.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cgm_service"]
      interval: 5s
      timeout: 5s
      retries: 5
  web:
    build: .
    restart: unless-stopped
    volumes:
      - .:/app
    ports:
      - "8090:8090"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: cgm_service
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
