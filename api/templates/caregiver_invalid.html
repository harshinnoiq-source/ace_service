<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invalid Invitation</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, sans-serif;
            background: #f0f4f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 36px 32px;
            max-width: 460px;
            width: 100%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.10);
            text-align: center;
        }

        .icon {
            font-size: 56px;
            margin-bottom: 20px;
        }

        h2 {
            color: #c62828;
            font-size: 22px;
            margin-bottom: 12px;
        }

        p {
            color: #555;
            font-size: 15px;
            line-height: 1.7;
        }

        .footer {
            margin-top: 28px;
            color: #aaa;
            font-size: 12px;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="icon">⚠️</div>
    <h2>Invitation Not Valid</h2>
    <p>{{ message }}</p>
    <p class="footer">
        Please ask the person who invited you to send a new invitation.
    </p>
</div>
</body>
</html>
