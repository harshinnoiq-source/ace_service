<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Service Version</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 50px;
            background-color: #f9f9f9;
        }
        .card {
            background: white;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            max-width: 400px;
        }
        h2 { color: #333; }
        p { color: #555; }
    </style>
</head>
<body>
<div class="card">
    <h2>Current Version: {{ version.version }}</h2>
    <p>{{ version.description }}</p>
</div>
</body>
</html>
